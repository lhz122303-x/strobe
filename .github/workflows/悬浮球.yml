name: Build Floating Ball APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create Android project
        run: |

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FloatingBall"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          mkdir -p app/src/main/java/com/example/floatingball
          mkdir -p app/src/main/res/values

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.example.floatingball"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.floatingball"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="悬浮球"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FloatingBallService"
                      android:exported="false"
                      android:stopWithTask="false" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/floatingball/MainActivity.java <<'EOF'
          package com.example.floatingball;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(40, 40, 40, 40);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("白色悬浮球");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);

                  TextView info = new TextView(this);
                  info.setText(
                      "点击下面的按钮开启悬浮球。\n\n" +
                      "开启后，白色圆球会显示在其他应用上方，" +
                      "可以拖动到屏幕任意位置。"
                  );
                  info.setTextSize(16);
                  info.setTextColor(Color.DKGRAY);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, 30, 0, 30);

                  Button button = new Button(this);
                  button.setText("开启悬浮球");

                  button.setOnClickListener(v -> {

                      if (!Settings.canDrawOverlays(this)) {

                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );

                          startActivity(intent);

                      } else {

                          startBallService();
                      }
                  });

                  root.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          -1,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  );

                  root.addView(
                      info,
                      new LinearLayout.LayoutParams(
                          -1,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  );

                  root.addView(
                      button,
                      new LinearLayout.LayoutParams(
                          -1,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  );

                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (Settings.canDrawOverlays(this)) {
                      startBallService();
                  }
              }

              private void startBallService() {

                  Intent intent =
                      new Intent(this, FloatingBallService.class);

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(intent);
                  } else {
                      startService(intent);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/floatingball/FloatingBallService.java <<'EOF'
          package com.example.floatingball;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          public class FloatingBallService extends Service {

              private WindowManager windowManager;
              private View ball;

              private float downX;
              private float downY;
              private int startX;
              private int startY;

              private static final String CHANNEL_ID = "floating_ball";

              @Override
              public void onCreate() {
                  super.onCreate();

                  createNotificationChannel();

                  Notification notification =
                      new Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("悬浮球正在运行")
                          .setContentText("白色悬浮球已开启")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build();

                  startForeground(1001, notification);

                  showBall();
              }

              private void showBall() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  windowManager =
                      (WindowManager) getSystemService(WINDOW_SERVICE);

                  TextView view = new TextView(this);

                  view.setText("");
                  view.setBackground(createBallBackground());
                  view.setElevation(20);

                  int size = dp(56);

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          size,
                          size,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                              ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                              : WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                              | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          android.graphics.PixelFormat.TRANSLUCENT
                      );

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 40;
                  params.y = 300;

                  view.setOnTouchListener(new View.OnTouchListener() {

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {

                          switch (event.getAction()) {

                              case MotionEvent.ACTION_DOWN:

                                  downX = event.getRawX();
                                  downY = event.getRawY();

                                  startX = params.x;
                                  startY = params.y;

                                  return true;

                              case MotionEvent.ACTION_MOVE:

                                  float dx =
                                      event.getRawX() - downX;

                                  float dy =
                                      event.getRawY() - downY;

                                  params.x =
                                      startX + (int) dx;

                                  params.y =
                                      startY + (int) dy;

                                  try {
                                      windowManager.updateViewLayout(
                                          view,
                                          params
                                      );
                                  } catch (Exception ignored) {
                                  }

                                  return true;

                              case MotionEvent.ACTION_UP:

                                  float moveX =
                                      Math.abs(event.getRawX() - downX);

                                  float moveY =
                                      Math.abs(event.getRawY() - downY);

                                  if (moveX < 15 && moveY < 15) {
                                      onBallClick();
                                  }

                                  return true;
                          }

                          return false;
                      }
                  });

                  ball = view;

                  windowManager.addView(ball, params);
              }

              private GradientDrawable createBallBackground() {

                  GradientDrawable drawable =
                      new GradientDrawable();

                  drawable.setShape(
                      GradientDrawable.OVAL
                  );

                  drawable.setColor(Color.WHITE);

                  drawable.setStroke(
                      dp(1),
                      0x22000000
                  );

                  return drawable;
              }

              private void onBallClick() {

                  // 点击悬浮球时的动作。
                  // 目前默认不执行额外操作。
                  //
                  // 如果你想让它点击后弹出菜单、
                  // 打开 App 或执行其他功能，
                  // 可以在这里继续添加。
              }

              private int dp(int value) {

                  float density =
                      getResources()
                          .getDisplayMetrics()
                          .density;

                  return (int) (value * density + 0.5f);
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "悬浮球",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public int onStartCommand(
                  Intent intent,
                  int flags,
                  int startId
              ) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {

                  if (ball != null && windowManager != null) {

                      try {
                          windowManager.removeView(ball);
                      } catch (Exception ignored) {
                      }

                      ball = null;
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBall-apk
          path: app/build/outputs/apk/debug/app-debug.apk
